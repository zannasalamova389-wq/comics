<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Комиксы — Детство СССР</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h1>📚 Комиксы из детства</h1>
  <p>Листайте страницы и увеличивайте картинку</p>
</header>

<main class="comic-container">
  
  <!-- Контейнер для картинки (с возможностью перетаскивания) -->
  <div class="image-viewport" id="viewport">
    <img id="comicImage" src="" alt="Страница комикса">
  </div>

  <!-- Панель управления -->
  <div class="controls">
    <button id="prevBtn" class="nav-btn">← Назад</button>
    <span id="counter" class="counter">1 / 12</span>
    <button id="nextBtn" class="nav-btn">Вперёд →</button>
  </div>

  <!-- Кнопки зума -->
  <div class="zoom-controls">
    <button id="zoomOutBtn" class="zoom-btn">➖</button>
    <span id="zoomLevel" class="zoom-text">100%</span>
    <button id="zoomInBtn" class="zoom-btn">➕</button>
  </div>

</main>

<footer class="footer">
  <p>© 2026 Жанна Шаломова. Авторский проект.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
