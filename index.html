<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Комиксы — Детство СССР</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h1>📚 Комиксы из детства</h1>
</header>

<main class="comic-container">
  
  <div class="comic-page">
    <img id="comicImage" src="" alt="Страница комикса" onclick="toggleZoom(this)">
    <div id="comicTitle" class="comic-title"></div>
  </div>

  <!-- Кнопки управления -->
  <div class="controls">
    <button id="prevBtn" class="nav-btn">← Назад</button>
    <span id="counter" class="counter">1 / 18</span>
    <button id="nextBtn" class="nav-btn">Вперёд →</button>
  </div>

</main>

<footer class="footer">
  <p>© 2026 Жанна Шаломова. Авторский проект.</p>
</footer>

<script src="script.js"></script>
