<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Комиксы — Детство СССР</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h1>📚 Комиксы из детства</h1>
</header>

<main class="comic-container">
  
  <!-- Контейнер для картинки -->
  <div class="comic-page" id="comicPage">
    <img id="comicImage" src="" alt="Страница комикса">
  </div>

  <!-- ЕДИНАЯ КОМПАКТНАЯ ПАНЕЛЬ УПРАВЛЕНИЯ -->
  <div class="controls">
    
    <!-- Левая часть: Зум -->
    <div class="zoom-group">
      <button id="zoomOutBtn" class="icon-btn">➖</button>
      <span id="zoomLevel" class="zoom-text">100%</span>
      <button id="zoomInBtn" class="icon-btn">➕</button>
    </div>

    <!-- Центральная часть: Листание -->
    <div class="nav-group">
      <button id="prevBtn" class="nav-btn">← Назад</button>
      <span id="counter" class="counter">1 / 19</span>
      <button id="nextBtn" class="nav-btn">Вперёд →</button>
    </div>

    <!-- Правая часть: Полный экран -->
    <div class="fullscreen-group">
      <button id="fullscreenBtn" class="icon-btn" title="На весь экран">⛶</button>
    </div>

  </div>

</main>

<footer class="footer">
  <p>© 2026 Жанна Шаломова. Авторский проект.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
